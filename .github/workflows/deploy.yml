name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get full git history for checking file changes

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deploy script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          EXTERNAL_MAIL_SECRET: ${{ secrets.EXTERNAL_MAIL_SECRET }}
        run: pnpm exec tsx scripts/deploy/index.ts

      - name: Preserve pre-migration D1 export
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: d1-before-migration
          path: artifacts/d1-backup/*.sql
          if-no-files-found: warn
          retention-days: 30

      # Clean up
      - name: Post deployment cleanup
        run: |
          rm -f .env*.*
          rm -f wrangler*.json wrangler*.jsonc
